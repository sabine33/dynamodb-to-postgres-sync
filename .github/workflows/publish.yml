name: Publish Package to npmjs

on:
  # 1. Replaced 'release' with 'repository_dispatch' to listen for custom API requests
  repository_dispatch:
    types: [manual-npm-publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing/Provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - run: npm ci
      
      # 2. Replaced the static token environment variable. 
      # Since you have provenance enabled and permissions configured, npm v11.5.1+ 
      # automatically negotiates Trusted Publishing via OIDC without needing a token secret.
      - run: npm publish --provenance --access public
